# GENERATE TIME: Sun Apr 12 20:42:07 2026
# CMD:
# basicsr/train.py -opt options/train/SRFormer/train_SRFormer_rice_x8.yml --launcher none

name: SRFormer_x8_official_b4
model_type: SwinIRModel
scale: 8
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: RiceTrain
    type: PairedImageDataset
    dataroot_gt: ./redacted/path
    dataroot_lq: ./redacted/path
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_1:
    name: RiceVal
    type: PairedImageDataset
    dataroot_gt: ./redacted/path
    dataroot_lq: ./redacted/path
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: SRFormer
  upscale: 8
  in_chans: 3
  img_size: 32
  window_size: 16
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [100000, 180000, 220000, 240000]
    gamma: 0.5

  total_iter: 250000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 8
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 8
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
